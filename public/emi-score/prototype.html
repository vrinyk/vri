document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n:           rgb(0, 182, 240);       /* onecard accent */\n\n  --freed-link:           rgb(0, 70, 133);        /* in-app links */\n\n  /* ── NEUTRALS ────────────────────────────────────────────────────────── */\n  --freed-fg-1:           rgb(35, 31, 32);        /* body emphasis */\n  --freed-fg-2:           rgb(46, 46, 46);        /* body default */\n  --freed-fg-3:           rgb(78, 78, 78);        /* secondary body */\n  --freed-fg-4:           rgb(109, 110, 113);     /* tertiary */\n  --freed-fg-5:           rgb(147, 149, 152);     /* placeholder-ish */\n  --freed-fg-placeholder: rgb(189, 189, 189);     /* input placeholder */\n  --freed-divider:        rgb(235, 235, 235);     /* hairline / track */\n  --freed-stroke:         rgb(224, 224, 224);     /* heavier divider */\n  --freed-bg-soft:        rgb(247, 248, 251);     /* tinted section bg */\n  --freed-bg-tile:        rgb(230, 231, 232);     /* very-light grey tile */\n  --freed-surface:        rgb(255, 255, 255);     /* card surface */\n  --freed-canvas:         rgb(255, 255, 255);     /* page bg */\n\n  /* ── SEMANTIC ────────────────────────────────────────────────────────── */\n  --color-bg:             var(--freed-canvas);\n  --color-surface:        var(--freed-surface);\n  --color-fg:             var(--freed-fg-2);\n  --color-fg-muted:       var(--freed-fg-3);\n  --color-fg-faint:       var(--freed-fg-4);\n  --color-primary:        var(--freed-navy);\n  --color-on-primary:     var(--freed-surface);\n  --color-accent:         var(--freed-orange);\n  --color-success:        var(--freed-green);\n  --color-warning:        var(--freed-gold);\n  --color-link:           var(--freed-link);\n  --color-border:         var(--freed-divider);\n  --color-border-strong:  var(--freed-stroke);\n  --color-input-border:   var(--freed-navy-soft);\n  --color-highlight:      var(--freed-orange-soft);\n\n  /* ── TYPOGRAPHY ──────────────────────────────────────────────────────── */\n  --font-sans:    \"Helvetica Neue\", \"HelveticaNeue\", \"Inter\", system-ui,\n                  -apple-system, \"SF Pro Display\", \"Segoe UI\", Arial, sans-serif;\n  --font-display: \"Helvetica Now Display\", \"Helvetica Neue\", \"Inter\",\n                  system-ui, sans-serif;\n  --font-mono:    ui-monospace, SFMono-Regular, \"SF Mono\", Menlo, Consolas,\n                  monospace;\n\n  /* Weights actually shipped */\n  --fw-regular:   400;\n  --fw-medium:    500;\n  --fw-semibold:  600;\n  --fw-bold:      700;\n  --fw-black:     900;\n\n  /* Type ramp — mobile (414 design) */\n  --fs-display:   28px;  /* big onboarding headline */\n  --fs-h1:        20px;  /* welcome / page title */\n  --fs-h2:        18px;  /* primary button label */\n  --fs-h3:        16px;  /* section label */\n  --fs-body:      14px;  /* default body */\n  --fs-small:     12px;  /* card labels / FAQ stems */\n  --fs-tiny:      10px;  /* meta / \"Settlement By\" */\n\n  /* Type ramp — desktop website */\n  --fs-hero:      54px;\n  --fs-section:   34px;\n  --fs-eyebrow:   18px;\n\n  --lh-tight:     1.2;\n  --lh-snug:      1.4;\n  --lh-base:      1.5;\n  --lh-relaxed:   1.6;\n\n  --ls-tight:    -0.01em;\n  --ls-normal:    0;\n  --ls-wide:      0.02em;\n\n  /* ── SPACING (8-point) ───────────────────────────────────────────────── */\n  --space-1:      4px;\n  --space-2:      8px;\n  --space-3:      12px;\n  --space-4:      16px;\n  --space-5:      20px;\n  --space-6:      24px;\n  --space-7:      32px;\n  --space-8:      48px;\n  --space-9:      64px;\n  --space-10:     80px;\n  --space-11:     120px;\n\n  /* Mobile screen gutters */\n  --gutter-mobile:  32px;\n  --gutter-card:    16px;\n\n  /* ── RADII ───────────────────────────────────────────────────────────── */\n  --radius-xs:    4px;\n  --radius-sm:    6px;\n  --radius-md:    8px;     /* primary buttons, inputs */\n  --radius-lg:    10px;    /* cards */\n  --radius-xl:    16px;    /* sheets, hero blocks */\n  --radius-2xl:   24px;\n  --radius-pill:  999px;\n  --radius-full:  50%;\n\n  /* ── BORDERS ─────────────────────────────────────────────────────────── */\n  --border-hairline:  1px solid var(--color-border);\n  --border-strong:    1px solid var(--color-border-strong);\n  --border-input:     2px solid var(--color-input-border);\n  --border-input-focus: 2px solid var(--color-primary);\n\n  /* ── SHADOWS ─────────────────────────────────────────────────────────── */\n  --shadow-card:      0 4px 12px rgba(0, 0, 0, 0.08);\n  --shadow-card-hover:0 8px 24px rgba(0, 0, 0, 0.10);\n  --shadow-sticky:    0 -4px 16px rgba(0, 0, 0, 0.06);\n  --shadow-inner:     inset 0 1px 2px rgba(0, 0, 0, 0.06);\n  --shadow-modal:     0 24px 48px rgba(2, 65, 110, 0.18);\n\n  /* ── MOTION ──────────────────────────────────────────────────────────── */\n  --ease-standard:   cubic-bezier(0.4, 0, 0.2, 1);\n  --ease-emphasis:   cubic-bezier(0.2, 0, 0, 1);\n  --dur-fast:        150ms;\n  --dur-base:        220ms;\n  --dur-slow:        320ms;\n\n  /* ── DEVICE WIDTHS ───────────────────────────────────────────────────── */\n  --w-mobile:        414px;\n  --w-tablet:        768px;\n  --w-desktop:      1440px;\n  --h-status-ios:    33.5px;\n}\n\n/* =========================================================================\n * Semantic role styles. These mirror real component vocab in the Figma:\n * \"Welcome Back!\" headline, \"Please Login to continue\" sub, \"Mobile\" label,\n * primary CTA copy, FAQ stems, etc.\n * ========================================================================= */\n\n.freed-display {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-display);\n  line-height: var(--lh-tight);\n  color: var(--freed-orange);\n  letter-spacing: var(--ls-tight);\n}\n\n.freed-h1 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h1);\n  line-height: var(--lh-base);\n  color: var(--freed-fg-1);\n}\n\n.freed-h2 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h2);\n  line-height: var(--lh-snug);\n  color: var(--freed-fg-1);\n}\n\n.freed-h3 {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-base);\n  color: var(--freed-fg-1);\n}\n\n.freed-body {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--freed-fg-3);\n}\n\n.freed-body-strong {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-body);\n  line-height: var(--lh-relaxed);\n  color: var(--freed-fg-2);\n}\n\n.freed-small {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-small);\n  line-height: var(--lh-base);\n  color: var(--freed-fg-3);\n}\n\n.freed-tiny {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-regular);\n  font-size: var(--fs-tiny);\n  line-height: var(--lh-tight);\n  color: var(--freed-fg-3);\n}\n\n.freed-label {\n  font-family: var(--font-sans);\n  font-weight: var(--fw-medium);\n  font-size: var(--fs-h3);\n  line-height: var(--lh-relaxed);\n  color: var(--freed-fg-3);\n}\n\n.freed-numeric {\n  font-family: var(--font-display);\n  font-weight: var(--fw-bold);\n  font-size: 22px;\n  line-height: var(--lh-tight);\n  color: var(--freed-fg-1);\n  font-variant-numeric: tabular-nums;\n}\n\n.freed-currency::before { content: \"₹\"; }\n\n.freed-link {\n  color: var(--color-link);\n  font-weight: var(--fw-medium);\n  text-decoration: none;\n}\n.freed-link:hover { text-decoration: underline; }\n\n/* =========================================================================\n * Surfaces: cards, peach blob, sticky CTA stack.\n * ========================================================================= */\n.freed-card {\n  background: var(--color-surface);\n  border-radius: var(--radius-lg);\n  box-shadow: var(--shadow-card);\n  padding: var(--space-5);\n}\n\n.freed-blob {\n  position: absolute;\n  inset-inline-start: 0;\n  bottom: -8%;\n  width: 110%;\n  aspect-ratio: 438 / 524;\n  background: var(--freed-peach);\n  border-radius: 50%;\n  opacity: 0.76;\n  transform: matrix(1, 0.023, -0.023, 1, 0, 0);\n  z-index: 0;\n  pointer-events: none;\n}\n\n/* =========================================================================\n * Buttons — primary navy w/ optional paper-plane.\n * ========================================================================= */\n.freed-btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--space-2);\n  height: 52px;\n  padding: 0 var(--space-5);\n  border-radius: var(--radius-md);\n  font-family: var(--font-sans);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-h2);\n  line-height: 1;\n  border: 0;\n  cursor: pointer;\n  transition: background-color var(--dur-fast) var(--ease-standard),\n              transform var(--dur-fast) var(--ease-standard),\n              opacity var(--dur-fast) var(--ease-standard);\n}\n\n.freed-btn-primary {\n  background: var(--color-primary);\n  color: var(--color-on-primary);\n}\n.freed-btn-primary:hover { background: #013353; }\n.freed-btn-primary:active { transform: scale(0.98); }\n.freed-btn-primary[disabled] { background: var(--freed-navy-muted); cursor: not-allowed; }\n\n.freed-btn-secondary {\n  background: var(--color-surface);\n  color: var(--color-primary);\n  border: 1.5px solid var(--color-primary);\n}\n.freed-btn-secondary:hover { background: var(--freed-navy); color: #fff; }\n\n.freed-btn-orange {\n  background: var(--freed-orange);\n  color: #fff;\n}\n.freed-btn-orange:hover { background: var(--freed-orange-dark); }\n\n.freed-btn-pill {\n  height: 40px;\n  border-radius: var(--radius-pill);\n  background: #fff;\n  border: 1.5px solid var(--color-primary);\n  color: var(--color-primary);\n  padding: 0 var(--space-5);\n  font-size: var(--fs-body);\n}\n\n/* Inputs */\n.freed-input {\n  width: 100%;\n  height: 50px;\n  border-radius: var(- e=\"#f29a96\" stroke-width=\"26\"><\u002Fpath>\n              <path d=\"M64 61 A95 95 0 0 1 113 36.3\" fill=\"none\" stroke=\"#fdeeb0\" stroke-width=\"26\"><\u002Fpath>\n              <path d=\"M147 36.3 A95 95 0 0 1 196 61\" fill=\"none\" stroke=\"#f6cf4d\" stroke-width=\"26\"><\u002Fpath>\n              <path d=\"M199.5 65.5 A95 95 0 0 1 225 130\" fill=\"none\" stroke=\"#7cc065\" stroke-width=\"26\"><\u002Fpath>\n              <g transform=\"rotate(-44 130 130)\">\n                <path d=\"M130 130 L78 124 L130 116 Z\" fill=\"#bcd6f0\"><\u002Fpath>\n                <circle cx=\"130\" cy=\"130\" r=\"15\" fill=\"#bcd6f0\"><\u002Fcircle>\n                <circle cx=\"130\" cy=\"130\" r=\"6\" fill=\"#dfeaf6\"><\u002Fcircle>\n              <\u002Fg>\n              <rect x=\"30\" y=\"138\" width=\"200\" height=\"8\" rx=\"4\" fill=\"#eef1f4\"><\u002Frect>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;align-items:flex-start;padding:6px 6px 0;\">\n            <div style=\"width:42%;display:flex;flex-direction:column;align-items:center;margin-left:4%;\"><div style=\"width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid #2e2e2e;margin-bottom:4px;\"><\u002Fdiv><div style=\"font-size:12.5px;color:#5a5a5a;\">{{ t.youAreHere }}<\u002Fdiv><\u002Fdiv>\n            <div style=\"width:50%;font-size:13px;color:#7a7a7a;text-align:right;line-height:1.4;\">{{ t.creditSide }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px;background:#fef3ee;border-radius:14px;padding:16px 18px;font-size:16px;font-weight:700;line-height:1.45;\"><span style=\"color:#3a3a3a;\">{{ t.creditCalloutA }} <\u002Fspan><span style=\"color:var(--freed-orange);\">{{ t.creditCalloutB }}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- OVER 20K INPUT -->\n      <sc-if value=\"{{ mOver20k }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 32px;animation:emiSheetUp .3s var(--ease-emphasis);\">\n        <div style=\"width:42px;height:5px;border-radius:3px;background:#e2e2e2;margin:0 auto 14px;\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;\"><div style=\"font-size:20px;font-weight:700;color:var(--freed-navy);\">{{ t.over20kTitle }}<\u002Fdiv><button onclick=\"{{ closeModal }}\" style=\"background:none;border:0;font-size:22px;color:#999;cursor:pointer;line-height:1;\">×<\u002Fbutton><\u002Fdiv>\n        <div style=\"font-size:14px;color:#7a7a7a;margin-top:6px;\">{{ t.over20kSub }}<\u002Fdiv>\n        <div style=\"margin-top:20px;border:2.5px solid var(--freed-navy);border-radius:14px;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;\">\n          <div style=\"display:flex;align-items:center;gap:6px;font-size:26px;font-weight:700;color:var(--freed-navy);\">₹<input inputmode=\"numeric\" value=\"{{ over20kFmt }}\" oninput=\"{{ setOver20k }}\" style=\"border:0;outline:none;font-family:inherit;font-size:26px;font-weight:700;color:var(--freed-navy);width:160px;background:transparent;\"><\u002Fdiv>\n          <span style=\"color:#bdbdbd;font-size:16px;\">{{ t.perMonth }}<\u002Fspan>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeModal }}\" style=\"width:100%;margin-top:22px;height:54px;border:0;border-radius:10px;background:var(--freed-navy);color:#fff;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;\">{{ t.confirm }}<\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- EDIT INCOME & SAVINGS -->\n      <sc-if value=\"{{ mEdit }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 24px 32px;animation:emiSheetUp .3s var(--ease-emphasis);\">\n        <div style=\"width:42px;height:5px;border-radius:3px;background:#e2e2e2;margin:0 auto 14px;\"><\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:space-between;\"><div style=\"font-size:20px;font-weight:700;color:var(--freed-navy);\">{{ t.editTitle }}<\u002Fdiv><button onclick=\"{{ closeModal }}\" style=\"background:none;border:0;font-size:22px;color:#999;cursor:pointer;line-height:1;\">×<\u002Fbutton><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:20px;\">\n          <div><div style=\"font-size:13px;font-weight:600;color:#7a7a7a;margin-bottom:7px;\">{{ t.monthlyIncome }}<\u002Fdiv><div style=\"border:2px solid var(--freed-navy-soft);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:var(--freed-navy);\">₹<input inputmode=\"numeric\" value=\"{{ incomeFmt }}\" oninput=\"{{ setIncome }}\" style=\"border:0;outline:none;font-family:inherit;font-size:18px;font-weight:700;color:var(--freed-navy);width:100%;background:transparent;\"><\u002Fdiv><\u002Fdiv>\n          <div><div style=\"font-size:13px;font-weight:600;color:#7a7a7a;margin-bottom:7px;\">{{ t.monthlyExpenses }}<\u002Fdiv><div style=\"border:2px solid var(--freed-navy-soft);border-radius:10px;padding:12px 16px;display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700;color:var(--freed-navy);\">₹<input inputmode=\"numeric\" value=\"{{ expensesFmt }}\" oninput=\"{{ setExpenses }}\" style=\"border:0;outline:none;font-family:inherit;font-size:18px;font-weight:700;color:var(--freed-navy);width:100%;background:transparent;\"><\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <button onclick=\"{{ closeModal }}\" style=\"width:100%;margin-top:24px;height:54px;border:0;border-radius:10px;background:var(--freed-navy);color:#fff;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;\">{{ t.updateScore }} <svg width=\"23\" height=\"23\" viewBox=\"0 0 24 24\" fill=\"var(--freed-orange)\" style=\"flex:0 0 auto;\"><path d=\"M2 21l21-9L2 3v7l15 2-15 2v7z\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:462,&quot;height&quot;:944}}\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'landing',   // landing | income | expenses | savings | loader | detail\n    lang: 'en',\n    income: '',\n    expenses: '',\n    savingsSel: 1,       // index into savings radio options\n    over20k: 25000,\n    loaderPct: 0,\n    score: 29,           // EMI score shown on gauge + callout\n    modal: null,         // meaning | emiload | savings | credit | over20k | edit | lang\n  };\n\n  T() {\n    const all = window.EMI_T || {};\n    return all[this.state.lang] || all.en || {};\n  }\n  componentDidMount() {\n    if (window.EMI_T) { this.forceUpdate(); return; }\n    let tries = 0;\n    const retry = () => {\n      if (window.EMI_T || tries++ > 120) { this.forceUpdate(); return; }\n      requestAnimationFrame(retry);\n    };\n    requestAnimationFrame(retry);\n  }\n  fmt(n) {\n    n = Math.round(Number(n) || 0);\n    return n.toLocaleString('en-IN');\n  }\n\n  go(screen) { this.setState({ screen, modal: null }); }\n\n  parseNum(v) { const d = String(v).replace(/[^0-9]/g, ''); return d === '' ? '' : Number(d); }\n  fmtE(n) { return (n === '' || n === null || n === undefined) ? '' : this.fmt(n); }\n\n  savRowStyle(sel) {\n    return 'display:flex;align-items:center;gap:14px;width:100%;padding:15px 16px;border-radius:12px;font-family:inherit;cursor:pointer;'\n      + (sel ? 'border:2px solid var(--freed-navy);background:#eef4fb;' : 'border:1px solid #ededed;background:#f7f8fa;');\n  }\n  savIconStyle(sel) {\n    return 'width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;'\n      + (sel ? 'background:#dce8f5;' : 'background:#eef0f3;');\n  }\n  langRowStyle(sel) {\n    return 'display:flex;align-items:center;justify-content:space-between;width:100%;padding:15px 16px;border-radius:12px;font-family:inherit;font-size:16px;cursor:pointer;margin-bottom:10px;'\n      + (sel ? 'background:#eef4fb;border:1.5px solid var(--freed-navy);color:var(--freed-navy);font-weight:700;' : 'background:#f7f8fa;border:1px solid #ededed;color:#3a3a3a;font-weight:500;');\n  }\n  savDotStyle(sel) {\n    return 'width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;'\n      + (sel ? 'background:var(--freed-navy);border:2px solid var(--freed-navy);' : 'background:#fff;border:2px solid #cfd4da;');\n  }\n\n  startLoader() {\n    this.setState({ screen: 'loader', loaderPct: 0, modal: null });\n    setTimeout(() => this._animateLoader(), 80);\n  }\n  _animateLoader() {\n    let pct = 0;\n    const step = () => {\n      pct += 2;\n      const numEl = document.getElementById('emiLoaderNum');\n      const ring = document.getElementById('emiLoaderRing');\n      if (numEl) numEl.textContent = pct;\n      if (ring) ring.setAttribute('stroke-dasharray', pct + ' 100');\n      if (pct >= 100) { setTimeout(() => this.setState({ screen: 'detail' }), 450); return; }\n      setTimeout(step, 50);\n    };\n    step();\n  }\n\n  tabStyle(active) {\n    return 'flex:1;border:0;border-radius:999px;padding:11px 0;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;'\n      + (active ? 'background:#fff;color:var(--freed-navy);' : 'background:transparent;color:#dbe6f0;');\n  }\n\n  savingsAmount() {\n    const mid = [0, 2500, 7500, 12500, 0];\n    const i = this.state.savingsSel;\n    return i === 4 ? (Number(this.state.over20k) || 0) : mid[i];\n  }\n  bandFor(score, t) {\n    if (score <= 20) return { label: t.bandVeryLow, action: t.actVeryLow, headline: t.hlVeryLow, color: '#e2484b', track: '#f7dada', pillBg: '#fdecec', pillColor: '#e2484b' };\n    if (score <= 40) return { label: t.bandLow, action: t.actLow, headline: t.hlLow, color: '#ef7d2e', track: '#fbe0cf', pillBg: '#fff0e6', pillColor: '#ef7d2e' };\n    if (score <= 60) return { label: t.bandAverage, action: t.actAverage, headline: t.hlAverage, color: '#f0a821', track: '#fbeccb', pillBg: '#fff6e0', pillColor: '#d98a1f' };\n    if (score <= 80) return { label: t.bandGood, action: t.actGood, headline: t.hlGood, color: '#5db257', track: '#dcefda', pillBg: '#eaf7ea', pillColor: '#3f9a47' };\n    return { label: t.bandExcellent, action: t.actExcellent, headline: t.hlExcellent, color: '#0a7d3c', track: '#d6ecdd', pillBg: '#e7f6ec', pillColor: '#0a7d3c' };\n  }\n  computeMetrics(t) {\n    const I = Number(this.state.income) || 0;\n    const E = Number(this.state.expenses) || 0;\n    const S = this.savingsAmount();\n    let score;\n    if (I <= 0) { score = 29; }            // no input yet -> demo value\n    else {\n      const burdenScore = Math.max(0, 1 - E / I);        // low expense ratio is good\n      const savingsScore = Math.min(1, (S / I) / 0.3);   // 30%+ savings = full marks\n      score = Math.round(100 * (0.6 * burdenScore + 0.4 * savingsScore));\n      score = Math.max(0, Math.min(100, score));\n    }\n    const band = this.bandFor(score, t);\n    const ang = Math.PI * (1 - score / 100);             // 180deg..0deg\n    const kx = (120 + 100 * Math.cos(ang)).toFixed(1);\n    const ky = (120 - 100 * Math.sin(ang)).toFixed(1);\n    return { score, band, kx, ky };\n  }\n\n  selectSaving(i) {\n    if (i === 4) { this.setState({ savingsSel: 4, modal: 'over20k' }); }\n    else this.setState({ savingsSel: i });\n  }\n\n  renderVals() {\n    const t = this.T();\n    const s = this.state;\n    const m = this.computeMetrics(t);\n    return {\n      t,\n      isLanding: s.screen === 'landing',\n      isIncome: s.screen === 'income',\n      isExpenses: s.screen === 'expenses',\n      isSavings: s.screen === 'savings',\n      isLoader: s.screen === 'loader',\n      isDetail: s.screen === 'detail',\n\n      lang: s.lang,\n      tabEnStyle: this.tabStyle(s.lang === 'en'),\n      tabHiStyle: this.tabStyle(s.lang === 'hi'),\n      tabHgStyle: this.tabStyle(s.lang === 'hg'),\n      setEn: () => this.setState({ lang: 'en' }),\n      setHi: () => this.setState({ lang: 'hi' }),\n      setHg: () => this.setState({ lang: 'hg' }),\n\n      incomeFmt: this.fmtE(s.income),\n      expensesFmt: this.fmtE(s.expenses),\n      over20kFmt: this.fmt(s.over20k),\n      score: m.score,\n      scoreDash: m.score + ' 100',\n      gaugeColor: m.band.color,\n      gaugeTrack: m.band.track,\n      knobX: m.kx,\n      knobY: m.ky,\n      scoreBadge: m.band.label,\n      scoreBadgeBg: m.band.pillBg,\n      scoreBadgeColor: m.band.pillColor,\n      headline: m.band.headline,\n      calloutAction: m.band.action,\n      calloutColor: m.band.pillColor,\n      callPreDyn: String(t.callPre || '').replace('29', String(m.score)).replace(/,?\\s*$/, ', '),\n\n      goLanding: () => this.go('landing'),\n      goIncome: () => this.go('income'),\n      goExpenses: () => this.go('expenses'),\n      goSavings: () => this.go('savings'),\n      goLoader: () => this.startLoader(),\n      goDetail: () => this.go('detail'),\n\n      loaderPct: s.loaderPct,\n      ringDash: s.loaderPct + ' 100',\n\n      setIncome: (e) => this.setState({ income: this.parseNum(e.target.value) }),\n      setExpenses: (e) => this.setState({ expenses: this.parseNum(e.target.value) }),\n      setOver20k: (e) => this.setState({ over20k: this.parseNum(e.target.value) }),\n\n      sel0: s.savingsSel === 0, sel1: s.savingsSel === 1, sel2: s.savingsSel === 2, sel3: s.savingsSel === 3, sel4: s.savingsSel === 4,\n      pick0: () => this.selectSaving(0), pick1: () => this.selectSaving(1), pick2: () => this.selectSaving(2), pick3: () => this.selectSaving(3), pick4: () => this.selectSaving(4),\n      savRow0: this.savRowStyle(s.savingsSel===0), savRow1: this.savRowStyle(s.savingsSel===1), savRow2: this.savRowStyle(s.savingsSel===2), savRow3: this.savRowStyle(s.savingsSel===3), savRow4: this.savRowStyle(s.savingsSel===4),\n      savIcon0: this.savIconStyle(s.savingsSel===0), savIcon1: this.savIconStyle(s.savingsSel===1), savIcon2: this.savIconStyle(s.savingsSel===2), savIcon3: this.savIconStyle(s.savingsSel===3), savIcon4: this.savIconStyle(s.savingsSel===4),\n      savDot0: this.savDotStyle(s.savingsSel===0), savDot1: this.savDotStyle(s.savingsSel===1), savDot2: this.savDotStyle(s.savingsSel===2), savDot3: this.savDotStyle(s.savingsSel===3), savDot4: this.savDotStyle(s.savingsSel===4),\n\n      modalOpen: s.modal !== null,\n      langIsEn: s.lang === 'en', langIsHi: s.lang === 'hi', langIsHg: s.lang === 'hg',\n      langRowEn: this.langRowStyle(s.lang === 'en'), langRowHi: this.langRowStyle(s.lang === 'hi'), langRowHg: this.langRowStyle(s.lang === 'hg'),\n      chooseEn: () => this.setState({ lang: 'en', modal: null }),\n      chooseHi: () => this.setState({ lang: 'hi', modal: null }),\n      chooseHg: () => this.setState({ lang: 'hg', modal: null }),\n      modalNone: s.modal === null,\n      mMeaning: s.modal === 'meaning',\n      mEmiload: s.modal === 'emiload',\n      mSavings: s.modal === 'savings',\n      mCredit: s.modal === 'credit',\n      mOver20k: s.modal === 'over20k',\n      mEdit: s.modal === 'edit',\n      mLang: s.modal === 'lang',\n      openMeaning: () => this.setState({ modal: 'meaning' }),\n      openEmiload: () => this.setState({ modal: 'emiload' }),\n      openSavings: () => this.setState({ modal: 'savings' }),\n      openCredit: () => this.setState({ modal: 'credit' }),\n      openEdit: () => this.setState({ modal: 'edit' }),\n      openLang: () => this.setState({ modal: 'lang' }),\n      closeModal: () => this.setState({ modal: null }),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
